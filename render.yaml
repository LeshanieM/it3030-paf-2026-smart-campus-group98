services:
  # Backend Web Service
  - type: web
    name: facility-flow-api

    rootDir: backend
    plan: free
    envVars:
      - key: PORT
        value: 8092
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        value: facility-flow
